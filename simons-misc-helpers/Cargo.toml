[package]
name = "simons-misc-helpers"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "simons-misc-helpers"
path = "src/main.rs"

[lib]
name = "simons_misc_helpers"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
semver = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
