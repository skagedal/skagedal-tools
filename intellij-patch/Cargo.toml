[package]
name = "intellij-patch"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "intellij-patch"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
toml.workspace = true
xmltree = { version = "0.12", features = ["attribute-order"] }
shellexpand = "3"

[dev-dependencies]
tempfile.workspace = true
