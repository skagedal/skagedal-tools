<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Just the page + folded corner, in two high-contrast colors: at 16px,
       subtle color contrasts (e.g. a darker purple fold) and thin details
       disappear into a solid blob. No other decoration - the toolbar badge
       (see common.js) is what signals note state, so baking a checkmark
       into the icon itself read as a second, redundant badge. -->
  <path d="M 26 14
           L 84 14
           L 106 36
           L 106 108
           Q 106 114 100 114
           L 26 114
           Q 20 114 20 108
           L 20 20
           Q 20 14 26 14
           Z" fill="#8b5cf6"/>
  <path d="M 84 14 L 106 36 L 84 36 Z" fill="#ffffff"/>
</svg>
