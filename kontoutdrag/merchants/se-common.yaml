# Common Swedish merchants, as they appear in bank statement exports.
#
# Descriptors are matched after normalisation: upper case, and runs of
# whitespace collapsed. Diacritics are left as they are, so a chain that
# arrives both as `HEMKOP` and as `HEMKÖP` needs both patterns written
# out. That is deliberate — a rule here means exactly what it says.
#
# A pattern ending in a space means a word boundary: `prefix: "SL "`
# matches `SL APP` but not the butcher's hall down the road. YAML strips
# a trailing space from an unquoted scalar, so quote those patterns.
#
# Card descriptors are truncated — SEB cuts them to twelve characters — so
# `prefix` is the rule you want almost always. Where an acquirer mangles a
# diacritic into a space rather than dropping it (`K PMANS TORG` for
# Köpmans Torg) the mangled spelling is listed as its own pattern,
# because no rule about diacritics recovers it.
#
# This table deliberately stops at chains anyone in Sweden would
# recognise. Anything regional, niche or small-chain belongs in a table of
# your own, loaded after this one so it wins — not only because it is
# yours, but because which of those appear at all says something about
# whoever built the table.

version: 1
name: se-common
description: National Swedish chains, utilities, public bodies and the usual subscriptions

# Payment providers that put their own name in front of the merchant's.
# Tried only when the descriptor matches nothing as written, so a shop
# whose name really does start with these letters is left alone.
normalize:
  strip_prefixes:
    - prefix: "KLARNA"
      provider: Klarna
    - prefix: "K*"
      provider: Klarna
    - prefix: "ZETTLE"
      provider: Zettle
    - prefix: "IZ "
      provider: Zettle
    - prefix: "SUMUP"
      provider: SumUp
    - prefix: "PAYPAL"
      provider: PayPal
    - prefix: "SP*"
      provider: Shopify
    - prefix: "SQ*"
      provider: Square
    - prefix: "STRIPE"
      provider: Stripe
    # SEB's own marker for a card-not-present purchase.
    - prefix: "WWW "
      provider: null

