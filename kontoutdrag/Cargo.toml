[package]
name = "kontoutdrag"
version = "0.1.0"
edition.workspace = true
rust-version = "1.85"

[[bin]]
name = "kontoutdrag"
path = "src/main.rs"

[features]
default = []
# Off by default, as in log-viewer: wry pulls in heavy system deps on Linux,
# and the build runs pnpm and Vite via build.rs to build the React app under
# browser/. ./install turns it on; ./check and CI stay on the defaults.
web = ["dep:webview-shell"]

[dependencies]
anyhow.workspace = true
chrono.workspace = true
clap.workspace = true
include_dir.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
shellexpand.workspace = true
skagedal-dirs.workspace = true
thiserror.workspace = true
toml.workspace = true
webview-shell = { workspace = true, optional = true, features = ["app"] }

[build-dependencies]
webview-shell.workspace = true

[dev-dependencies]
tempfile.workspace = true
