[package]
name = "log-viewer"
version = "0.1.0"
edition.workspace = true

[[bin]]
name = "log-viewer"
path = "src/main.rs"

[features]
default = []
# `web` is off by default because wry pulls in heavy system deps
# (gtk-3 + webkit2gtk-4.1 on Linux), and because building it also runs
# pnpm + Vite via build.rs to (re)build the React app under browser/.
# The repo's ./install enables this feature; CI / ./check stays on the
# default feature set.
web = ["dep:include_dir", "dep:webview-shell"]

[dependencies]
anyhow.workspace = true
base64.workspace = true
clap.workspace = true
crossterm.workspace = true
include_dir = { workspace = true, optional = true }
ratatui.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
shell-escape.workspace = true
skagedal-dirs.workspace = true
toml.workspace = true
webview-shell = { workspace = true, optional = true, features = ["app"] }

[build-dependencies]
webview-shell.workspace = true
