[package]
name = "calendar-view"
version = "0.1.0"
edition.workspace = true

[[bin]]
name = "calendar-view"
path = "src/main.rs"

[features]
default = []
# Off by default, as in kontoutdrag: wry pulls in heavy system deps on Linux,
# and the build runs pnpm and Vite via build.rs to build the React app under
# browser/. ./install turns it on; ./check and CI stay on the defaults.
web = ["dep:webview-shell", "dep:include_dir"]

[dependencies]
anyhow.workspace = true
chrono.workspace = true
clap.workspace = true
include_dir = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
shellexpand.workspace = true
skagedal-dirs.workspace = true
toml.workspace = true
webview-shell = { workspace = true, optional = true, features = ["app"] }

[build-dependencies]
webview-shell.workspace = true

[dev-dependencies]
tempfile.workspace = true
