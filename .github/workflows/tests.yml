name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  rust:
    name: cargo test (${{ matrix.tool }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tool:
          - git-dirty-checker
          - log-jsonify
          - x-java-home
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.tool }}
      - name: cargo test
        working-directory: ${{ matrix.tool }}
        run: cargo test --verbose

  node:
    name: pnpm test (${{ matrix.tool }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tool:
          - cloudwatch-insights
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ${{ matrix.tool }}/pnpm-lock.yaml
      - name: pnpm install
        working-directory: ${{ matrix.tool }}
        run: pnpm install --frozen-lockfile
      - name: pnpm test
        working-directory: ${{ matrix.tool }}
        run: pnpm test

  java:
    name: mvn test (git-repos-latest-activity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: mvn test
        working-directory: git-repos-latest-activity
        run: mvn --batch-mode test
