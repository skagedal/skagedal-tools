name: Check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: '**/pnpm-lock.yaml'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          # The version jikido pins with fvm, so CI and local builds agree.
          flutter-version-file: jikido/.fvmrc
          cache: true
      - name: ./check
        run: ./check

  # appicon-generator draws through AppKit and Core Text, so it can only be
  # built and tested on macOS. Kept as its own job rather than moving the whole
  # check onto a macOS runner, which is slower and more expensive for the Rust,
  # Node, Java and Flutter tools that do not need it.
  check-swift:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable
      - name: swift --version
        run: swift --version
      # Reuses check-swift from shared.sh rather than repeating the lint /
      # build / test commands here, so there is only one definition of what
      # checking a Swift package means. shared.sh reads SCRIPT_DIR, which the
      # top-level scripts normally set for it.
      - name: check-swift appicon-generator
        run: |
          set -euo pipefail
          source ./shared.sh
          check-swift appicon-generator
        env:
          SCRIPT_DIR: ${{ github.workspace }}
