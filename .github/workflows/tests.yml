name: Check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: '**/pnpm-lock.yaml'
      - name: ./check
        run: ./check

  # Whether a pull request touches the Swift code or what checks it. On a push
  # to main, always.
  changes:
    runs-on: ubuntu-latest
    outputs:
      swift: ${{ steps.diff.outputs.swift }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A pull request checks out a merge commit; its first parent is the
          # base branch, so two commits are enough to diff against it.
          fetch-depth: 2
      - id: diff
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != pull_request ]] ||
              git diff --name-only HEAD^1 HEAD |
              grep -qE '^(appicon-generator/|shared\.sh$|\.github/workflows/tests\.yml$)'; then
              echo "swift=true" >> "$GITHUB_OUTPUT"
          else
              echo "swift=false" >> "$GITHUB_OUTPUT"
          fi

  # appicon-generator draws through AppKit and Core Text, so it can only be
  # built and tested on macOS. Kept as its own job rather than moving the whole
  # check onto a macOS runner, which is slower and more expensive for the Rust
  # and Node tools that do not need it.
  #
  # Skipped rather than filtered out with `paths:`, because check-swift is a
  # required check on main: a skipped job counts as passing, while a workflow
  # that never runs leaves the pull request waiting for it.
  check-swift:
    needs: changes
    if: needs.changes.outputs.swift == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable
      - name: swift --version
        run: swift --version
      # Reuses check-swift from shared.sh rather than repeating the lint /
      # build / test commands here, so there is only one definition of what
      # checking a Swift package means. shared.sh reads SCRIPT_DIR, which the
      # top-level scripts normally set for it.
      - name: check-swift appicon-generator
        run: |
          set -euo pipefail
          source ./shared.sh
          check-swift appicon-generator
        env:
          SCRIPT_DIR: ${{ github.workspace }}
