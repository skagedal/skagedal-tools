name: Check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: '**/pnpm-lock.yaml'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          # The version jikido pins with fvm, so CI and local builds agree.
          flutter-version-file: jikido/.fvmrc
          cache: true
      - name: ./check
        run: ./check

  # appicon-generator draws through AppKit and Core Text, so it can only be
  # built and tested on macOS. Kept as its own job rather than moving the whole
  # check onto a macOS runner, which is slower and more expensive for the Rust,
  # Node and Flutter tools that do not need it.
  check-swift:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable
      - name: swift --version
        run: swift --version
      # Reuses check-swift from shared.sh rather than repeating the lint /
      # build / test commands here, so there is only one definition of what
      # checking a Swift package means. shared.sh reads SCRIPT_DIR, which the
      # top-level scripts normally set for it.
      - name: check-swift appicon-generator
        run: |
          set -euo pipefail
          source ./shared.sh
          check-swift appicon-generator
        env:
          SCRIPT_DIR: ${{ github.workspace }}
