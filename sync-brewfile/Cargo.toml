[package]
name = "sync-brewfile"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "sync-brewfile"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3"
